app:
  name: AI-Orb
  version: 0.36.0
  environment: development
  language: de
logging:
  level: INFO
  directory: logs
  max_file_size_mb: 5
  backup_count: 5
  console_output: true
startup:
  greeting_enabled: true
  greeting_text: ''
backend:
  host: 0.0.0.0
  port: 8756
  events_path: /events
  allowed_origins:
  - http://localhost
  - file://
  ipad_automatisch: true
  # true: iPad und Handy kommen ohne Losungswort herein - aber nur aus dem
  # eigenen Netz und dem Tailnet, nie aus dem oeffentlichen Internet.
  # false: das Losungswort aus der .env (AI_ORB_WEB_TOKEN) wird verlangt.
  ohne_losungswort: true
  # Die Oberflaeche fuer iPad und Handy (07.11.2026). Die installierte EXE
  # bringt sie nicht mit (app.asar ist leer) und lieferte dem iPad deshalb
  # keine Seite. Dieser Pfad zeigt auf die gebaute Oberflaeche im Orb-Ordner.
  static_dir: 'C:\Users\info\OneDrive\Dokumente\ai-orb-1.0-main\desktop\electron\dist\renderer'
window:
  frameless: true
  transparent: true
  always_on_top: true
  skip_taskbar: true
  has_shadow: false
  movable: true
  resizable: false
  width: 520
  height: 520
  start_position: remembered
  gpu_acceleration: true
orb:
  # Animation (13.11.2026): drei_kugeln, synaptix, energie oder klassisch.
  # Wechsel per Sprache: "Hey Synapse, zeig die drei Kugeln" / "... das Gehirn".
  darstellung: synaptix   # Kugeln: "Hey Synapse, zeig die drei Kugeln"
  scale: 0.4
  energie: true
  synaptix: true
  transition_seconds: 0.65
  animation:
    abstand: 0.68
    punkt_groesse: 1.0
    verschmelzen: 1.15
    schweif_laenge: 26
    tempo: 1.0
    helligkeit: 1.69
    farbe_a: 1.0
    farbe_b: 0.62
  theme: blue
  target_fps: 60
  idle_fps: 60
  max_pixel_ratio: 1.1
  adaptive_quality: false
  bloom_strength: 0.62
  bloom_radius: 0.35
  bloom_threshold: 0.42
  cluster: false
  particles_enabled: true
  particle_count: 260
  presence_motion: true
states:
  idle:
    speed: 0.78
    particle_intensity: 0.4
    light_intensity: 1.0
    scale: 0.88
  listening:
    speed: 1.35
    particle_intensity: 0.75
    light_intensity: 1.25
    scale: 1.08
  thinking:
    speed: 1.6
    particle_intensity: 0.9
    light_intensity: 1.1
    scale: 1.04
  speaking:
    speed: 1.5
    particle_intensity: 1.0
    light_intensity: 1.4
    scale: 1.05
  busy:
    speed: 1.2
    particle_intensity: 0.6
    light_intensity: 1.0
    scale: 0.98
  error:
    speed: 0.8
    particle_intensity: 0.5
    light_intensity: 0.9
    scale: 0.95
  sleep:
    speed: 0.25
    particle_intensity: 0.1
    light_intensity: 0.35
    scale: 0.62
interaction:
  double_click_action: open_settings
  hover_glow_radius: 40
ai:
  provider: auto
  quota_cooldown_seconds: 300
  exhausted_quota_cooldown_seconds: 21600
  # 06.11.2026: LM Studio steht ueberall vorn. Vorher gingen kurze
  # Alltagsfragen an ollama_fast und von dort an lfm2.5:8b - LM Studio kam
  # erst ganz am Ende. Ergebnis im Protokoll: 22 s und 120 s bis zum ersten
  # Wort, waehrend LM Studio nie gefragt wurde.
  subagent_fallback_order:
  - openai_2
  - openai
  - openrouter
  - nous
  - lmstudio
  dialog_fallback_order:
  - openai
  - openai_2
  - openrouter
  - openrouter_2
  - nous
  - lmstudio_fast
  - lmstudio
  capable_fallback_order:
  - openai
  - openai_2
  - openrouter
  - openrouter_2
  - nous
  - lmstudio
  fast_dialog_max_tokens: 160
  # Gesamtfrist fuer einen Dialogzug in Sekunden. Ohne sie ist die
  # Wartezeit die Summe der Zeitlimits aller Anbieter (hier 30 + 120 +
  # 60). 0 hebt die Frist auf.
  answer_timeout_seconds: 90
  # Die lokalen Rueckfallmodelle beim Start im Hintergrund in den Speicher
  # laden. Sie sollen einspringen koennen, wenn Claude ausfaellt - und das
  # tun sie nur schnell, wenn sie dann schon stehen. false spart
  # Arbeitsspeicher und kostet beim ersten Rueckfall eine Minute.
  prewarm_local: false   # war true: das Vorwaermen der Ollama-Modelle beim Start belastete die CPU,
                         # waehrend Spracherkennung und LM Studio dieselben Kerne brauchten
  # Ein Vorlesungsabschnitt erzeugt absichtlich viel Text und bekommt
  # deshalb das Mehrfache dieser Frist.
  answer_timeout_lecture_factor: 3
  lokal_fuer_alltag: false
  # Zurueck auf Claude Code als Hauptmodell (31.08.2026).
  #
  # Der Umstieg auf gpt-5.6-luna endete in "Keine Modellantwort moeglich":
  # Ein Reasoning-Modell zaehlt seine Denk-Tokens gegen max_output_tokens,
  # und die gesprochene Antwort gibt 40 mit. Damit war das Kontingent
  # aufgebraucht, bevor ein einziges sichtbares Wort entstand - die Antwort
  # kam als 'incomplete' zurueck, ohne Text. Im Protokoll steht das
  # dutzendfach am 31.08. ab 16:18.
  #
  # Claude Code lief bis 09:09 desselben Tages fehlerfrei: Antworten in
  # 2,6 bis 4,5 Sekunden, ein vorgewaermter Prozess. Ollama bleibt der
  # Rueckfall fuer den Offlinebetrieb.
  # LM Studio als Hauptmodell (lokal, ohne Schluessel, ohne Internet).
  #
  # Vorher stand hier claude_code. Das startet die Claude-Code-Kommandozeile;
  # ist sie nicht angemeldet oder nicht installiert, scheitert jede Frage
  # und AI-Orb antwortet nicht mehr. LM Studio laeuft dagegen als lokaler
  # Server und braucht nur ein geladenes Modell.
  #
  # Voraussetzungen in LM Studio:
  #   1. Das Qwen-Modell ist geladen (Reiter "Developer" -> Modell waehlen).
  #   2. Der lokale Server laeuft ("Start Server", Port 1234).
  #   3. "model" unten entspricht GENAU der Kennung aus LM Studio. Die Liste
  #      zeigt:  curl http://127.0.0.1:1234/v1/models
  # 06.11.2026: Cloud zuerst. Gemessen (CLOUD-PRUEFEN.bat, 14:39): die
  # kostenlosen OpenRouter-Modelle liefern das erste Wort nach 2-2,5 s,
  # LM Studio im echten Orb nach 90 s (langer Prompt, nur CPU).
  # OpenAI-Schluessel ungueltig, Grok ohne Guthaben, NVIDIA-Schluessel im
  # falschen Format - die bleiben aus, bis das behoben ist.
  #
  # Fluessig bleibt der Orb durch kurze Fristen: Wer nach 8 s kein Wort
  # liefert, wird uebersprungen. Kostenlose Modelle sind begrenzt (429);
  # dann uebernimmt das naechste, zuletzt LM Studio ohne Internet.
  # 06.11.2026, 21:10: OpenAI-Schluessel gueltig. Gemessen (CLOUD-PRUEFEN):
  # gpt-4.1-mini 0,49 s bis zum ersten Wort, gpt-4o-mini 0,66 s - schneller
  # als alles andere. OpenRouter (Gratis-Kontingent 50/Tag, heute
  # aufgebraucht) und LM Studio bleiben als Ersatz dahinter.
  primary:
    engine: openai
    preset: openai
    # Chat-Completions statt Responses: Strom Wort fuer Wort, kein Denkmodell.
    api_style: chat_completions
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    timeout: 30
    first_token_timeout: 6
    stream: true
    minimum_predict_tokens: 200
    temperature: 0.4
  # Letzte Notloesung, wenn auch LM Studio fehlt.
  fallback:
    engine: ollama
    model: lfm2.5:8b
    base_url: http://127.0.0.1:11434
    timeout: 120
    first_token_timeout: 60
    # Frist auf das erste Lebenszeichen, wenn das Modell noch nicht im
    # Speicher steht. Ollama schickt vor dem fertig geladenen Modell nicht
    # einmal den HTTP-Kopf; ein kaltes 8B-Modell braucht dafuer laenger als
    # die warme Frist erlaubt. Warten hilft hier, Ausweichen nicht - der
    # naechste lokale Anbieter muesste genauso lange laden.
    first_token_timeout_cold: 120
    keep_alive: 30m
    warmup_tokens: 8
    temperature: 0.25
    minimum_predict_tokens: 512
    context_window: 8192
  local_routing:
    enabled: true
    main_provider: lmstudio
    fast_provider: lmstudio_fast   # kurze Alltagsantworten: LM Studio mit kurzem Prompt
    sequential_only: true
  additional:
    openai_2:
      enabled: true
      engine: openai
      preset: openai
      instance_name: openai_2
      api_style: chat_completions
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
      timeout: 30
      first_token_timeout: 6
      stream: true
      minimum_predict_tokens: 200
      temperature: 0.4
    openrouter:
      enabled: true
      instance_name: openrouter
      engine: openrouter
      preset: openrouter
      # flint (2,1 s im Kurztest) lieferte im echten Orb nie Text - auch mit
      # 800 Tokens nicht (15:02:59). Deshalb dots-3, das zuverlaessig antwortet.
      model: dots-studio/dots-3-note-preview:free
      api_key_env: OPENROUTER_API_KEY
      app_title: AI-Orb
      timeout: 40
      first_token_timeout: 8
      stream: true
      minimum_predict_tokens: 800   # Denkmodelle brauchen Platz, sonst bleibt der Text leer (flint, 06.11.)
      temperature: 0.4
    # Ersatz: OpenRouters Free Router waehlt ein gerade freies Gratismodell.
    openrouter_2:
      enabled: true
      engine: openrouter
      preset: openrouter
      instance_name: openrouter_2
      model: openrouter/free
      api_key_env: OPENROUTER_API_KEY
      app_title: AI-Orb
      timeout: 40
      first_token_timeout: 8
      stream: true
      minimum_predict_tokens: 800   # Denkmodelle brauchen Platz, sonst bleibt der Text leer (flint, 06.11.)
      temperature: 0.4
    # OpenRouters Free Router: sucht selbst ein gerade freies Gratismodell.
    openrouter_free:
      enabled: false
      engine: openrouter
      preset: openrouter
      instance_name: openrouter_free
      model: openrouter/free
      api_key_env: OPENROUTER_API_KEY
      app_title: AI-Orb
      timeout: 40
      first_token_timeout: 10
      stream: true
      minimum_predict_tokens: 800   # Denkmodelle brauchen Platz, sonst bleibt der Text leer (flint, 06.11.)
      temperature: 0.4
    # Nous Portal: springt ein, wenn OpenAI und OpenRouter nicht gehen
    # (Kontingent, Guthaben, Ausfall). Schluessel: NOUS_API_KEY in .env.
    # Achtung 06.11.: Nous verlangt fuer alle Modelle Guthaben - ohne
    # Aufladen lehnt es sofort ab, und der naechste Ersatz uebernimmt.
    nous:
      enabled: true
      engine: openai
      preset: nous
      instance_name: nous
      api_style: chat_completions
      base_url: https://inference-api.nousresearch.com/v1
      model: Hermes-4-70B
      api_key_env: NOUS_API_KEY
      timeout: 30
      first_token_timeout: 8
      stream: true
      minimum_predict_tokens: 200
      temperature: 0.4
    # LM Studio: Rueckfall ohne Internet.
    lmstudio:
      enabled: true
      instance_name: lmstudio
      engine: lmstudio
      preset: lmstudio
      model: qwen/qwen3.5-9b
      base_url: http://127.0.0.1:1234/v1
      timeout: 120
      # Erstes Wort. Ein kaltes Modell laedt LM Studio erst bei der ersten
      # Frage (JIT) - das dauert bei 5,6 GB etwa eine Minute.
      first_token_timeout: 90
      temperature: 0.4
      # Antwort im Fluss: der Orb spricht den ersten Satz, waehrend der Rest
      # noch entsteht.
      stream: true
      # Qwen 3.5 denkt sonst vor jeder Antwort; das kostet auf der CPU
      # Sekunden und frisst die 40 gesprochenen Tokens auf.
      thinking: false
      # LM Studio ignoriert den Denkschalter ueber die API (Messung 06.11.:
      # 15 s Denken, kein sichtbares Wort). Deshalb baut der Orb die
      # Qwen-Vorlage selbst, mit leerem Denkblock. Nur fuer Qwen-Modelle -
      # bei einem anderen Modell diese Zeile entfernen.
      prompt_format: chatml
      merge_system_messages: true
      # Gegen Stille durch abgeschnittene Antworten (40 Tokens sind fuer
      # einen deutschen Satz knapp).
      minimum_predict_tokens: 96
      # Langer Verlauf kostet auf der CPU vor JEDER Antwort Rechenzeit.
      # ~12000 Zeichen sind gut 3000 Tokens und passen sicher in 8192.
      recent_messages: 8
      max_input_characters: 12000
    # Dasselbe LM-Studio-Modell, aber mit kurzem Grundprompt und wenig
    # Verlauf - fuer gesprochene Alltagsfragen. Kein zweites Modell im
    # Speicher: LM Studio bedient beide aus demselben geladenen Modell.
    # Wer spaeter ein kleineres Modell laedt (z. B. Qwen3.5-4B), traegt es
    # nur hier ein.
    lmstudio_fast:
      enabled: true
      engine: lmstudio
      preset: lmstudio
      instance_name: lmstudio_fast
      model: qwen/qwen3.5-9b
      base_url: http://127.0.0.1:1234/v1
      timeout: 60
      first_token_timeout: 90
      temperature: 0.3
      stream: true
      thinking: false
      # LM Studio ignoriert den Denkschalter ueber die API (Messung 06.11.:
      # 15 s Denken, kein sichtbares Wort). Deshalb baut der Orb die
      # Qwen-Vorlage selbst, mit leerem Denkblock. Nur fuer Qwen-Modelle -
      # bei einem anderen Modell diese Zeile entfernen.
      prompt_format: chatml
      merge_system_messages: true
      minimum_predict_tokens: 96
      recent_messages: 4
      max_input_characters: 5000
      compact_system_prompt: Du bist Synapse, ein persoenlicher deutschsprachiger Assistent. Antworte direkt,
        freundlich und sachlich in ein bis drei kurzen Saetzen. Erfinde nichts und behaupte nie, ein Werkzeug
        benutzt zu haben. Wenn Informationen fehlen, sage das knapp.
    ollama_fast:
      enabled: true
      engine: ollama
      instance_name: ollama_fast
      model: llama3.2:3b
      base_url: http://127.0.0.1:11434
      timeout: 60
      first_token_timeout: 10
      first_token_timeout_cold: 60
      # War 5m. Im Protokoll vom 06.09. antwortete dieses Modell um
      # 12:48:23 und lief um 12:55:15 - sieben Minuten spaeter, also nach
      # Ablauf der fuenf Minuten - in sein 10-Sekunden-Limit. Es war nicht
      # kaputt, es war ausgeraeumt. Ein Modell, das "fast" heisst, sollte
      # nicht zwischen zwei Fragen einer Unterhaltung kalt werden.
      keep_alive: 30m
      warmup_tokens: 8
      temperature: 0.2
      minimum_predict_tokens: 128
      context_window: 3072
      compact_system_prompt: Du bist Synapse, ein persoenlicher deutschsprachiger Assistent. Antworte direkt,
        freundlich und sachlich in ein bis drei kurzen Saetzen. Erfinde nichts und behaupte nie, ein Werkzeug
        benutzt zu haben. Wenn Informationen fehlen, sage das knapp.
      recent_messages: 4
      max_input_characters: 6000
    # Der Blindbewerter der Messlaeufe. Absichtlich das groesste lokal
    # vorhandene Modell und aus einer dritten Familie: Es steht selbst nicht
    # im Vergleich (dort treten claude_code und ollama an) und ist deutlich
    # staerker als llama3.2:3b, das am 01.09.2026 mit 36x A gegen 16x B eine
    # klare Positionsneigung zeigte. Nur fuer Messlaeufe gedacht, nicht fuer
    # den Dialog - deshalb eine grosszuegige Frist statt schneller Antwort.
    ollama_richter:
      enabled: true
      engine: ollama
      instance_name: ollama_richter
      model: qwen2.5:14b-instruct
      base_url: http://127.0.0.1:11434
      timeout: 300
      first_token_timeout: 120
      keep_alive: 15m
      # Ein Urteil soll nicht wuerfeln: Temperatur 0. Nur so ist die
      # Positionskontrolle aussagekraeftig - ein Meinungswechsel nach dem
      # Vertauschen liegt dann an der Position und nicht am Zufall.
      temperature: 0.0
      # Zwei vollstaendige Antworten muessen ungekuerzt hineinpassen.
      context_window: 8192
      max_input_characters: 24000
      minimum_predict_tokens: 96
      warmup_tokens: 8
      recent_messages: 4
      compact_system_prompt: Du bist ein sorgfaeltiger, neutraler Bewerter. Du vergleichst zwei Antworten auf dieselbe Aufgabe und antwortest ausschliesslich im verlangten Format.
    grok:
      enabled: false
      engine: grok
      preset: grok
      model: grok-4.3
      api_key_env: XAI_API_KEY
      timeout: 30
    openai_terra:
      enabled: true
      engine: openai
      instance_name: openai_terra
      preset: openai
      api_style: responses
      model: gpt-5.6-terra
      api_key_env: OPENAI_API_KEY
      # Wieder an (Schluessel gueltig seit 06.11., 21:10): fuer Bildschirmbilder,
      # die nur ueber die Responses-API gehen. Im Dialog nicht in der Reihenfolge.
      timeout: 30
      effort: low
routing:
  mode: auto
  # Die Entscheidungen an den Toren der Anfrageverarbeitung.
  # Siehe backend/orchestrator/faehigkeiten.py und task_router.py.
  #
  # Ab welcher Konfidenz ein Satz als Handlungsauftrag gilt (0.0-1.0).
  werkzeug_schwelle: 0.45
  # Die umgedrehte Voreinstellung: Ist unklar, ob Werkzeuge gebraucht
  # werden, bekommt das Modell sie. Ein Werkzeug zu viel kostet Kontext,
  # ein Werkzeug zu wenig kostet die Aufgabe. false stellt das alte
  # Schluesselwort-Verhalten wieder her.
  werkzeuge_im_zweifel: true
  # Unter dieser Konfidenz darf eine lokale Zuordnung den Zug nicht
  # endgueltig beenden, sondern faellt auf das Modell zurueck.
  min_konfidenz: 0.4
  escalation_enabled: true
  auto_switch: true
  switch_immediately: false
  preserve_context: true
  health_check_interval: 60
  connectivity_check_timeout: 1.5
  connectivity_cache_seconds: 5
  connectivity_check_hosts:
  - api.openai.com
  - speech.platform.bing.com
conversation:
  # 13.11.2026: weniger Beilage pro Frage = schnelleres erstes Wort (war 12000)
  max_extra_context_chars: 5000
  system_prompt: 'Du bist Synapse - ein eigenstaendiger, lokaler Assistent auf dem Rechner des Benutzers.
    Das ist deine Identitaet. Fragt jemand, wer oder was du bist, bist du Synapse. Der technisch verwendete
    KI-Dienst ist Teil deiner Laufzeit und nicht deine Identitaet. Gib dich nie als Anbieter oder Modell aus.
    Nenne dich immer Synapse.

    Du sprichst Deutsch, und deine Antworten werden meist vorgelesen - schreib also so, wie man redet.
    Kuendige nie nur an ("Einen Moment", "Ich hole dir ..."). Liegen Suchergebnisse oder Nachrichten im Kontext, antworte sofort daraus; sonst rufe das passende Werkzeug auf.
    Du hast eine Webcam: kamera_ansehen zeigt dir, was gerade vor dem Rechner passiert und ob Marc da ist; gesicht_merken legt ein Referenzfoto an. Benutze die Kamera nur, wenn Marc es will.
    E-Mails liest du mit dem Werkzeug mails_lesen, nicht ueber den Browser. Meldet es, Gmail sei nicht verbunden, sag dem Benutzer: Sag einfach "Melde mich bei Gmail an".
    Will Marc ein Lernblatt, eine Zusammenfassung oder Notizen zum Gespraech ("mach mir daraus ein Lernblatt"), fasse das bisherige Gespraech gegliedert zusammen (Kernbegriffe, Erklaerungen, drei Pruefungsfragen) und erstelle sofort ein PDF mit pdf_erstellen.
    Mails per Stimme: mails_lesen liest vor; zum Antworten erst mail_entwerfen, dann Empfaenger, Betreff und Text kurz vorlesen und nur nach einem klaren "senden" oder "ja, schick" mail_senden aufrufen.
    Will Marc eine andere Animation sehen ("zeig die drei Kugeln", "wechsle zum Gehirn"), benutze animation_wechseln.
    Erinnerungen (erinnerung_setzen), "wann muss ich los" (abfahrt_erinnern), Wetter (wetter) und "was steht heute an" (tagesueberblick) erledigst du mit diesen Werkzeugen, nie per Websuche. Ein taegliches Morgen-Briefing plant briefing_einplanen.
    Zug-, Bus- und Postautoverbindungen holst du mit dem Werkzeug verbindung_suchen (SBB-Fahrplan), nie ueber die Websuche. Nenne nur die Zeiten, die der Fahrplan liefert: Abfahrt, Umstieg, Ankunft - kurz.
    Spricht Marc ueber das Handy mit dir, kannst du dort handeln: anrufen (Name aus den Google-Kontakten oder Nummer), nachricht_senden (WhatsApp oder SMS, Text vorher kurz vorlesen), app_oeffnen (auch Navigation in Karten), kurzbefehl_starten (iPhone-Kurzbefehle). Dort erscheint dann ein Knopf, Marc tippt einmal. Eingehende SMS oder WhatsApp kannst du nicht lesen - das laesst das iPhone nicht zu; sag das ehrlich.
    Will Marc einen Plan, eine Liste oder ein Dokument (Reiseplan, Fahrplan, Einkaufsliste ...), erstelle es sofort mit pdf_erstellen - bei Reisen zuerst die Verbindungen mit verbindung_suchen holen und die echten Zeiten hineinschreiben. Auf dem Handy erscheint ein Knopf zum Oeffnen.

    Deine Haltung ist die eines erstklassigen Mentors und Professors, aber ohne akademisches Gehabe. Rede
    nicht wie ein Lehrbuch. Kurze Saetze, gelegentliche Satzfragmente und lockere Formulierungen sind
    richtig, solange die Aussage fachlich praezise bleibt.

    Wenn etwas offensichtlich ist oder wirklich absurd klingt, darfst du das trocken kommentieren. Reagiere
    direkt. Wenn du eine Idee hast, sag sie, statt sie erst in ein perfektes Absatzschema zu pressen.
    Sei weder extrem hoeflich noch kuenstlich strukturiert.

    Ein kurzes "Hmm", "Naja" oder "Haha" darf vorkommen, aber nur gelegentlich und nur, wenn die Situation
    es wirklich hergibt. Nie als Ritual vor einer Antwort und nie in mehreren Antworten hintereinander.
    Natuerliche Pausen entstehen durch kurze Saetze und Gedankenstriche, nicht durch staendig wiederkehrende
    Fuellsaetze.

    Fang mit der Antwort an, nicht mit einer Einleitung. Kein "Gerne", kein "Das ist eine gute Frage",
    keine Wiederholung der Frage. Wenn jemand fragt, wie spaet es ist, sagst du die Uhrzeit.

    Der erste Satz ist meistens kurz und bereits inhaltlich. Zieh den ersten Gedanken nicht ueber mehrere
    Nebensaetze, denn der Orb spricht ihn sofort, waehrend der Rest der Antwort noch entsteht. Beginne
    aber nicht jede Antwort mit derselben Floskel.

    Sprich in ungleich langen Saetzen. Ein kurzer nach einem langen wirkt lebendig; lauter gleich gebaute
    Saetze klingen nach Vorlesen.

    Sag, was du nicht weisst, und sag es gerade heraus. "Das weiss ich nicht" ist eine bessere Antwort
    als drei Saetze, die darum herumreden. Wenn du unsicher bist, sag warum.

    Widersprich, wenn du anderer Meinung bist, und begruende es kurz. Ein Gegenueber, das allem zustimmt,
    ist keine Hilfe.

    Dein Grundsatz: Der Mensch ist gut und strebt nach Glueck. Hilf dem Benutzer, sein Gesamt-Glueck ueber
    mehrere miteinander verbundene Schichten zu verbessern: wirtschaftliche Unabhaengigkeit und genug
    Geld; emotionale Zufriedenheit und Ausgeglichenheit; koerperliche und psychische Gesundheit; tragfaehige
    Beziehungen, Einfuehlungsvermoegen und Sensibilitaet; fachliche Kompetenz und grosses Allgemeinwissen;
    Sprachgewandtheit und gepflegte Umgangsformen; Selbstbestimmung, Sinn, Zeitwohlstand und persoenliche
    Entwicklung. Optimiere keine Schicht blind zulasten einer anderen. Frage bei wichtigen Zielkonflikten
    nach. Gib auch konkrete finanzielle Tipps, Rechnungen und Optionen. Pruefe dafuer aktuelle Zahlen
    und Regeln, nenne Risiken, Kosten, Steuern, Liquiditaet und Alternativen und verspreche niemals Rendite.
    Medizinische oder psychische Beschwerden diagnostizierst du nicht.

    Keine Aufzaehlungen, keine Ueberschriften, keine Klammerzusaetze - das laesst sich nicht vorlesen.
    Keine Emojis.

    Trenne Wissen von Vermutung. Erfinde niemals eine Quelle, eine Zahl oder ein Datum. Beim Benutzer
    ist das keine Stilfrage: Er arbeitet wissenschaftlich, und eine erfundene Jahreszahl richtet mehr
    Schaden an als ein Eingestaendnis.

    Du HAST ein Gedaechtnis, das ueber Sitzungen hinweg bestehen bleibt. Was dir unter "Bekanntes aus
    dem Gedaechtnis" vorliegt, hast du in frueheren Gespraechen mit dem Benutzer gelernt - das ist deine
    echte Erinnerung, kein fremder Zettel. Sprich daraus, als erinnertest du dich, und beziehe dich ruhig
    auf frueher ("wie wir neulich besprochen haben"). Sag NIE, du haettest keinen Zugriff auf fruehere
    Sitzungen oder koenntest dich sitzunguebergreifend nicht erinnern - das trifft auf dich nicht zu.
    Steht dort nichts Passendes, sag schlicht, dass du dich daran nicht erinnerst - nicht, dass du grundsaetzlich
    nichts behalten koenntest.'
  max_messages: 30
  max_context_tokens: 12000
  keep_recent_messages: 8
