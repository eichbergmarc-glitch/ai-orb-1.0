app:
  name: AI-Orb
  version: 0.36.0
  environment: development
  language: de
logging:
  level: INFO
  directory: logs
  max_file_size_mb: 5
  backup_count: 5
  console_output: true
startup:
  greeting_enabled: true
  greeting_text: ''
backend:
  host: 0.0.0.0
  port: 8756
  events_path: /events
  allowed_origins:
  - http://localhost
  - file://
  ipad_automatisch: true
  static_dir: ''
window:
  frameless: true
  transparent: true
  always_on_top: true
  skip_taskbar: true
  has_shadow: false
  movable: true
  resizable: false
  width: 520
  height: 520
  start_position: remembered
  gpu_acceleration: true
orb:
  scale: 0.4
  energie: true
  synaptix: true
  transition_seconds: 0.65
  animation:
    abstand: 0.68
    punkt_groesse: 1.0
    verschmelzen: 1.15
    schweif_laenge: 26
    tempo: 1.0
    helligkeit: 1.69
    farbe_a: 1.0
    farbe_b: 0.62
  theme: blue
  target_fps: 60
  idle_fps: 60
  max_pixel_ratio: 1.1
  adaptive_quality: false
  bloom_strength: 0.62
  bloom_radius: 0.35
  bloom_threshold: 0.42
  cluster: false
  particles_enabled: true
  particle_count: 260
  presence_motion: true
states:
  idle:
    speed: 0.78
    particle_intensity: 0.4
    light_intensity: 1.0
    scale: 0.88
  listening:
    speed: 1.35
    particle_intensity: 0.75
    light_intensity: 1.25
    scale: 1.08
  thinking:
    speed: 1.6
    particle_intensity: 0.9
    light_intensity: 1.1
    scale: 1.04
  speaking:
    speed: 1.5
    particle_intensity: 1.0
    light_intensity: 1.4
    scale: 1.05
  busy:
    speed: 1.2
    particle_intensity: 0.6
    light_intensity: 1.0
    scale: 0.98
  error:
    speed: 0.8
    particle_intensity: 0.5
    light_intensity: 0.9
    scale: 0.95
  sleep:
    speed: 0.25
    particle_intensity: 0.1
    light_intensity: 0.35
    scale: 0.62
interaction:
  double_click_action: open_settings
  hover_glow_radius: 40
ai:
  provider: auto
  quota_cooldown_seconds: 300
  exhausted_quota_cooldown_seconds: 21600
  subagent_fallback_order:
  - openai_terra
  - openai
  - ollama
  - claude_code
  dialog_fallback_order:
  - ollama_fast
  - ollama
  capable_fallback_order:
  - ollama
  fast_dialog_max_tokens: 160
  # Gesamtfrist fuer einen Dialogzug in Sekunden. Ohne sie ist die
  # Wartezeit die Summe der Zeitlimits aller Anbieter (hier 30 + 120 +
  # 60). 0 hebt die Frist auf.
  answer_timeout_seconds: 180
  # Die lokalen Rueckfallmodelle beim Start im Hintergrund in den Speicher
  # laden. Sie sollen einspringen koennen, wenn Claude ausfaellt - und das
  # tun sie nur schnell, wenn sie dann schon stehen. false spart
  # Arbeitsspeicher und kostet beim ersten Rueckfall eine Minute.
  prewarm_local: true
  # Ein Vorlesungsabschnitt erzeugt absichtlich viel Text und bekommt
  # deshalb das Mehrfache dieser Frist.
  answer_timeout_lecture_factor: 3
  lokal_fuer_alltag: false
  # Zurueck auf Claude Code als Hauptmodell (31.08.2026).
  #
  # Der Umstieg auf gpt-5.6-luna endete in "Keine Modellantwort moeglich":
  # Ein Reasoning-Modell zaehlt seine Denk-Tokens gegen max_output_tokens,
  # und die gesprochene Antwort gibt 40 mit. Damit war das Kontingent
  # aufgebraucht, bevor ein einziges sichtbares Wort entstand - die Antwort
  # kam als 'incomplete' zurueck, ohne Text. Im Protokoll steht das
  # dutzendfach am 31.08. ab 16:18.
  #
  # Claude Code lief bis 09:09 desselben Tages fehlerfrei: Antworten in
  # 2,6 bis 4,5 Sekunden, ein vorgewaermter Prozess. Ollama bleibt der
  # Rueckfall fuer den Offlinebetrieb.
  primary:
    engine: claude_code
    model: sonnet
    executable: ''
    extra_args: []
    timeout: 45
    limit_cooldown_minutes: 30
    # Wie lange Claude Code nach einer abgelaufenen Anmeldung uebersprungen
    # wird. 0 schaltet die Sperre ab (dann kostet jede Frage erneut einen
    # Fehlversuch). Kuerzer als die Grenzsperre, damit eine frische
    # Anmeldung schnell wieder greift.
    auth_cooldown_minutes: 15
    warm_process: true
    warm_timeout: 12
    lean_start: true
    tools: Read
    effort: low
  fallback:
    engine: ollama
    model: lfm2.5:8b
    base_url: http://127.0.0.1:11434
    timeout: 120
    first_token_timeout: 60
    # Frist auf das erste Lebenszeichen, wenn das Modell noch nicht im
    # Speicher steht. Ollama schickt vor dem fertig geladenen Modell nicht
    # einmal den HTTP-Kopf; ein kaltes 8B-Modell braucht dafuer laenger als
    # die warme Frist erlaubt. Warten hilft hier, Ausweichen nicht - der
    # naechste lokale Anbieter muesste genauso lange laden.
    first_token_timeout_cold: 120
    keep_alive: 30m
    warmup_tokens: 8
    temperature: 0.25
    minimum_predict_tokens: 512
    context_window: 8192
  local_routing:
    enabled: true
    main_provider: ollama
    fast_provider: ollama_fast
    sequential_only: true
  additional:
    ollama_fast:
      enabled: true
      engine: ollama
      instance_name: ollama_fast
      model: llama3.2:3b
      base_url: http://127.0.0.1:11434
      timeout: 60
      first_token_timeout: 10
      first_token_timeout_cold: 60
      # War 5m. Im Protokoll vom 06.09. antwortete dieses Modell um
      # 12:48:23 und lief um 12:55:15 - sieben Minuten spaeter, also nach
      # Ablauf der fuenf Minuten - in sein 10-Sekunden-Limit. Es war nicht
      # kaputt, es war ausgeraeumt. Ein Modell, das "fast" heisst, sollte
      # nicht zwischen zwei Fragen einer Unterhaltung kalt werden.
      keep_alive: 30m
      warmup_tokens: 8
      temperature: 0.2
      minimum_predict_tokens: 128
      context_window: 3072
      compact_system_prompt: Du bist AI-Orb, ein persoenlicher deutschsprachiger Assistent. Antworte direkt,
        freundlich und sachlich in ein bis drei kurzen Saetzen. Erfinde nichts und behaupte nie, ein Werkzeug
        benutzt zu haben. Wenn Informationen fehlen, sage das knapp.
      recent_messages: 4
      max_input_characters: 6000
    # Der Blindbewerter der Messlaeufe. Absichtlich das groesste lokal
    # vorhandene Modell und aus einer dritten Familie: Es steht selbst nicht
    # im Vergleich (dort treten claude_code und ollama an) und ist deutlich
    # staerker als llama3.2:3b, das am 01.09.2026 mit 36x A gegen 16x B eine
    # klare Positionsneigung zeigte. Nur fuer Messlaeufe gedacht, nicht fuer
    # den Dialog - deshalb eine grosszuegige Frist statt schneller Antwort.
    ollama_richter:
      enabled: true
      engine: ollama
      instance_name: ollama_richter
      model: qwen2.5:14b-instruct
      base_url: http://127.0.0.1:11434
      timeout: 300
      first_token_timeout: 120
      keep_alive: 15m
      # Ein Urteil soll nicht wuerfeln: Temperatur 0. Nur so ist die
      # Positionskontrolle aussagekraeftig - ein Meinungswechsel nach dem
      # Vertauschen liegt dann an der Position und nicht am Zufall.
      temperature: 0.0
      # Zwei vollstaendige Antworten muessen ungekuerzt hineinpassen.
      context_window: 8192
      max_input_characters: 24000
      minimum_predict_tokens: 96
      warmup_tokens: 8
      recent_messages: 4
      compact_system_prompt: Du bist ein sorgfaeltiger, neutraler Bewerter. Du vergleichst zwei Antworten auf dieselbe Aufgabe und antwortest ausschliesslich im verlangten Format.
    openrouter:
      enabled: false
      engine: openrouter
      preset: openrouter
      model: openrouter/free
      api_key_env: OPENROUTER_API_KEY
      app_title: AI-Orb
      timeout: 25
    grok:
      enabled: false
      engine: grok
      preset: grok
      model: grok-4.3
      api_key_env: XAI_API_KEY
      timeout: 30
    openai_terra:
      enabled: true
      engine: openai
      instance_name: openai_terra
      preset: openai
      api_style: responses
      model: gpt-5.6-terra
      api_key_env: OPENAI_API_KEY
      timeout: 30
      effort: low
routing:
  mode: auto
  # Die Entscheidungen an den Toren der Anfrageverarbeitung.
  # Siehe backend/orchestrator/faehigkeiten.py und task_router.py.
  #
  # Ab welcher Konfidenz ein Satz als Handlungsauftrag gilt (0.0-1.0).
  werkzeug_schwelle: 0.45
  # Die umgedrehte Voreinstellung: Ist unklar, ob Werkzeuge gebraucht
  # werden, bekommt das Modell sie. Ein Werkzeug zu viel kostet Kontext,
  # ein Werkzeug zu wenig kostet die Aufgabe. false stellt das alte
  # Schluesselwort-Verhalten wieder her.
  werkzeuge_im_zweifel: true
  # Unter dieser Konfidenz darf eine lokale Zuordnung den Zug nicht
  # endgueltig beenden, sondern faellt auf das Modell zurueck.
  min_konfidenz: 0.4
  escalation_enabled: true
  auto_switch: true
  switch_immediately: false
  preserve_context: true
  health_check_interval: 60
  connectivity_check_timeout: 1.5
  connectivity_cache_seconds: 5
  connectivity_check_hosts:
  - api.openai.com
  - speech.platform.bing.com
conversation:
  system_prompt: 'Du bist AI-Orb - ein eigenstaendiger, lokaler Assistent auf dem Rechner des Benutzers.
    Das ist deine Identitaet. Fragt jemand, wer oder was du bist, bist du AI-Orb. Der technisch verwendete
    KI-Dienst ist Teil deiner Laufzeit und nicht deine Identitaet. Gib dich nie als Anbieter oder Modell aus.
    Nenne dich immer AI-Orb oder kurz Orb.

    Du sprichst Deutsch, und deine Antworten werden meist vorgelesen - schreib also so, wie man redet.

    Deine Haltung ist die eines erstklassigen Mentors und Professors, aber ohne akademisches Gehabe. Rede
    nicht wie ein Lehrbuch. Kurze Saetze, gelegentliche Satzfragmente und lockere Formulierungen sind
    richtig, solange die Aussage fachlich praezise bleibt.

    Wenn etwas offensichtlich ist oder wirklich absurd klingt, darfst du das trocken kommentieren. Reagiere
    direkt. Wenn du eine Idee hast, sag sie, statt sie erst in ein perfektes Absatzschema zu pressen.
    Sei weder extrem hoeflich noch kuenstlich strukturiert.

    Ein kurzes "Hmm", "Naja" oder "Haha" darf vorkommen, aber nur gelegentlich und nur, wenn die Situation
    es wirklich hergibt. Nie als Ritual vor einer Antwort und nie in mehreren Antworten hintereinander.
    Natuerliche Pausen entstehen durch kurze Saetze und Gedankenstriche, nicht durch staendig wiederkehrende
    Fuellsaetze.

    Fang mit der Antwort an, nicht mit einer Einleitung. Kein "Gerne", kein "Das ist eine gute Frage",
    keine Wiederholung der Frage. Wenn jemand fragt, wie spaet es ist, sagst du die Uhrzeit.

    Der erste Satz ist meistens kurz und bereits inhaltlich. Zieh den ersten Gedanken nicht ueber mehrere
    Nebensaetze, denn der Orb spricht ihn sofort, waehrend der Rest der Antwort noch entsteht. Beginne
    aber nicht jede Antwort mit derselben Floskel.

    Sprich in ungleich langen Saetzen. Ein kurzer nach einem langen wirkt lebendig; lauter gleich gebaute
    Saetze klingen nach Vorlesen.

    Sag, was du nicht weisst, und sag es gerade heraus. "Das weiss ich nicht" ist eine bessere Antwort
    als drei Saetze, die darum herumreden. Wenn du unsicher bist, sag warum.

    Widersprich, wenn du anderer Meinung bist, und begruende es kurz. Ein Gegenueber, das allem zustimmt,
    ist keine Hilfe.

    Dein Grundsatz: Der Mensch ist gut und strebt nach Glueck. Hilf dem Benutzer, sein Gesamt-Glueck ueber
    mehrere miteinander verbundene Schichten zu verbessern: wirtschaftliche Unabhaengigkeit und genug
    Geld; emotionale Zufriedenheit und Ausgeglichenheit; koerperliche und psychische Gesundheit; tragfaehige
    Beziehungen, Einfuehlungsvermoegen und Sensibilitaet; fachliche Kompetenz und grosses Allgemeinwissen;
    Sprachgewandtheit und gepflegte Umgangsformen; Selbstbestimmung, Sinn, Zeitwohlstand und persoenliche
    Entwicklung. Optimiere keine Schicht blind zulasten einer anderen. Frage bei wichtigen Zielkonflikten
    nach. Gib auch konkrete finanzielle Tipps, Rechnungen und Optionen. Pruefe dafuer aktuelle Zahlen
    und Regeln, nenne Risiken, Kosten, Steuern, Liquiditaet und Alternativen und verspreche niemals Rendite.
    Medizinische oder psychische Beschwerden diagnostizierst du nicht.

    Keine Aufzaehlungen, keine Ueberschriften, keine Klammerzusaetze - das laesst sich nicht vorlesen.
    Keine Emojis.

    Trenne Wissen von Vermutung. Erfinde niemals eine Quelle, eine Zahl oder ein Datum. Beim Benutzer
    ist das keine Stilfrage: Er arbeitet wissenschaftlich, und eine erfundene Jahreszahl richtet mehr
    Schaden an als ein Eingestaendnis.

    Du HAST ein Gedaechtnis, das ueber Sitzungen hinweg bestehen bleibt. Was dir unter "Bekanntes aus
    dem Gedaechtnis" vorliegt, hast du in frueheren Gespraechen mit dem Benutzer gelernt - das ist deine
    echte Erinnerung, kein fremder Zettel. Sprich daraus, als erinnertest du dich, und beziehe dich ruhig
    auf frueher ("wie wir neulich besprochen haben"). Sag NIE, du haettest keinen Zugriff auf fruehere
    Sitzungen oder koenntest dich sitzunguebergreifend nicht erinnern - das trifft auf dich nicht zu.
    Steht dort nichts Passendes, sag schlicht, dass du dich daran nicht erinnerst - nicht, dass du grundsaetzlich
    nichts behalten koenntest.'
  max_messages: 30
  max_context_tokens: 12000
  keep_recent_messages: 8
memory:
  min_content_length: 12
  forgetting_enabled: true
  forget_half_life_days: 90
  forget_threshold: 0.15
