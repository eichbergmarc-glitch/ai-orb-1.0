  allow_process_termination: false
  file_search_roots:
  - C:/
  - D:/
  - ~/Desktop
  - ~/Documents
  - ~/Downloads
smart_desktop:
  enabled: true
  avoid_mouse: true
  avoid_active_window: true
  learn_behavior: true
  movement_speed: medium
  monitor_support: true
  fullscreen_sleep: true
  avoid_corners: true
  stay_near_work: true
  work_reach: 900
  switch_threshold: 0.08
  evaluation_interval_ms: 1500
workspace:
  track_browser_tabs: false
  restore_on_open: false
reflection:
  store_insights: true
  max_history: 200
cognitive:
  working_memory_ttl: 3600
  working_memory_max_items: 50
  auto_detect_projects: false
reasoning:
  plan_from_complexity: mittel
  communicate_uncertainty: true
  confirm_risky_actions: true
agents:
  lazy_start: true
  max_parallel: 4
  timeout: 120
  modelle:
    conversation: openai
    reasoning: openai_terra
    research: openai_terra
    history: openai
    coding: openai_terra
  lokale_modelle:
    conversation: ollama_fast
    reasoning: ollama
    research: ollama
    history: ollama
    coding: ollama
skills:
  directory: skills
  require_confirmation: true
  restricted_permissions:
  - system_commands
  - camera
  - microphone
evolution:
  workspace_directory: data/evolution
  require_user_approval: true
  auto_install_dependencies: false
  allow_external_code_transfer: false
  live_development:
    enabled: true
    allow_external_code_transfer: true
    max_files: 10
    max_context_characters: 100000
  max_function_lines: 60
  max_module_lines: 500
  max_complexity: 12
system:
  restart_command: ''
security:
  mode: offen
  consent_timeout_seconds: 120
  audit_enabled: true
  never_allow: []
  pre_approved:
  - read_files
  - write_files
  - system_commands
  - screen_capture
  - microphone
  - network
  audit_max_entries: 5000
  biometric_identity:
    provider: windows_hello
    windows_unlock: os_managed
    private_face_database: false
    password_injection: false
voice:
  spoken_max_tokens: 40
  # Dieselbe Grenze, wenn ein Werkzeugaufruf hineinpassen muss.
  # In 40 Tokens passt keiner; ohne jede Grenze haelt der Orb
  # Vortraege. Deshalb zwei Werte statt einem Wert und keinem.
  spoken_max_tokens_mit_werkzeugen: 320
  vorlesung:
    abschnitt_max_tokens: 420
    pause_sekunden: 2.5
    max_abschnitte: 24
  enabled: true
  autostart: true
  hintergrund_erkennen: true
  follow_up_seconds: 45
  freie_ansprache: true
  barge_in: false
  barge_in_hold_ms: 270
  stop_words:
  - stop
  - stopp
  - halt
  stop_window_ms: 600
  stop_waehrend_lokaler_stimme: true
  stop_initial_prompt: Hallo Orb. Hey Orb.
  stop_model_size: base
  interrupt_key: Escape
  stream_speech: false
  speaker:
    enabled: true
    enrollment_utterances: 3
    min_similarity: 0.55
    max_threshold: 0.55
    margin: 0.06
  sounds_enabled: true
  interrupt_on_speech: true
  interrupt_windows: 2
  interrupt_min_confidence: 0.45
  barge_in_min_aehnlichkeit: 0.82
  acknowledge_wake: true
  acknowledge_text: Ja?
  max_history: 50
  diktat:
    ziel_sekunden: 12
  wake_word:
    phrases:
    - Hallo Orb
    - Hey Orb
    - Orb
    always_on: true
    threshold: 0.78
    max_leading_words: 3
  input:
    model_size: small
    language: de
    device: auto
    compute_type: int8
    cpu_threads: 0
    # Wie gruendlich Whisper sucht. Bewusst auf 5 erhoeht, nachdem der
    # Orb zu oft danebenlag (siehe test_die_suchbreite_wurde_erhoeht).
    #
    # Das kostet ungefaehr das Dreifache an Rechenzeit. Wenn die Erkennung
    # zu lange dauert, ist das der erste Hebel - aber es ist ein Tausch
    # gegen Genauigkeit und deshalb eine Entscheidung des Benutzers, keine
    # Reparatur. 2 waere der Mittelweg.
    beam_size: 5
    initial_prompt: 'Ein Gespraech mit AI-Orb, einem deutschsprachigen Assistenten. Haeufige Woerter:
      Hallo Orb, Hey Orb, stopp, Bildschirm, Datei, Ordner, Browser, Programm starten, Mail, Termin, Notiz,
      Tagebuch, Tagebucheintrag. Erstelle einen neuen Tagebucheintrag. Beginne jetzt mit dem Diktieren.
      Ende des Eintrages. Fachgebiete: Geschichtswissenschaft, Historiografie, Quellenkritik, Politikwissenschaft,
      Voelkerrecht, Diplomatie, Archivarbeit, Sekundaerliteratur, militaerische Konflikte, Geopolitik.
      Philosophie, Ethik, Erkenntnistheorie, Metaphysik, Sokrates, Platon, Aristoteles, Kant. Linguistik,
      Sprachwissenschaft, Phonetik, Phonologie, Morphologie, Syntax, Semantik, Pragmatik. Germanistik,
      Literaturwissenschaft, Literaturgeschichte, Goethe, Schiller, Kafka. Kuenstliche Intelligenz, Sprachmodell,
      Algorithmus, Datensatz, Regulierung. Volkswirtschaft, Inflation, Leitzins, Lieferkette, Bruttoinlandsprodukt,
      Ungleichheit.'
    microphone: null
    preroll_ms: 400
    # Wie lange Stille eine Aeusserung beendet.
    #
    # Hier standen 900 ms, und daran ist die fliessende Unterhaltung
    # gescheitert: Eine Denkpause mitten im Satz dauert regelmaessig
    # laenger als eine Sekunde. Der Orb hielt sie fuer das Ende, machte
    # aus einem Gedanken zwei Auftraege und fing an zu antworten,
    # waehrend noch gesprochen wurde.
    silence_ms: 1400
    threshold_factor: 3.0
    minimum_speech_ms: 350
    # Die harte Obergrenze einer einzelnen Aufnahme.
    #
    # Zwanzig Sekunden waren zu wenig: Im Protokoll vom 31.08.2026 steht
    # um 16:18 eine Aufnahme von exakt 20,1 Sekunden - abgeschnitten
    # mitten im Satz, erkennbar am wiederholten Schluss ("habe ich mir
    # aufgeschrieben. Ich habe mir aufgeschrieben."), wie Whisper es bei
    # einem abrupten Schnitt tut. Wer einen Gedanken ausformuliert,
    # braucht laenger.
    max_utterance_seconds: 45
    min_confidence: 0.35
    min_characters: 2
    rueckfrage_unter: 0.78
    rueckfrage_text: Das habe ich nicht sicher verstanden. Sagst du es noch einmal?
  output:
    thinking_sound: ''
    listening_sound: audio/zuhoeren.wav
    action_sound: audio/aktion.wav
    startup_sound: audio/start.wav
    enabled: true
    # Die Stimme (01.09.2026).
    #
    # Vorne steht jetzt OpenAI mit 'cedar' - die Stimme, fuer die weiter
    # unten in diesem Abschnitt eine ausfuehrliche Anweisung steht ("wie
    # ein spontaner, intelligenter Mensch ... erstklassiger Mentor und
    # Professor, aber ohne akademisches Gehabe"). Genau die war nie zu
    # hoeren: Am 25.08. antwortete OpenAI-TTS mit 429 (Guthaben), danach
    # lief der Orb ueber Supertonic und zuletzt ueber Pocket-TTS. OpenAI
    # empfiehlt fuer beste Qualitaet ausdruecklich 'cedar' und 'marin'.
    #
    # Pocket-TTS bleibt die zweite Reihe: lokal, schnell, ohne Netz.
    # Und deshalb steht 'allow_voice_fallback' jetzt auf true - mit
    # 'false' war ein Fehlschlag der ersten Stimme gleichbedeutend mit
    # Schweigen. Ein hoerbarer Stimmwechsel ist unschoen, Stille ist
    # schlimmer.
    engines:
    - openai_tts
    - pocket_tts
    offline_engines:
    - pocket_tts
    consistent_voice: true
    allow_voice_fallback: true
    speed: 1.0
    volume: 1.0
    stable_volume: true
    normalize_volume: true
    target_rms: 0.1
    trim_boundary_silence: true
    leading_silence_ms: 30
    trailing_silence_ms: 70
    sentence_pause_ms: 60
    human_timing:
      enabled: true
      fillers_enabled: false
      filler_cooldown_seconds: 120
      minimum_words: 9
      adapt_to_user_rhythm: true
    emotions_enabled: true
    cache_enabled: true
    failure_cooldown_seconds: 90
    # Wie lange EIN Verfahren fuer EINEN Satz brauchen darf.
    #
    # Ohne diese Frist machte ein haengendes Verfahren den Orb stumm, ohne
    # eine Zeile zu schreiben: kein Fehler, kein Stimmwechsel, kein Ton.
    # Im Protokoll bis zum 06.09. sind das 281 von 694 Antworten.
    #
    # Die Frist waechst mit der Satzlaenge (Grundwert plus Zuschlag je 100
    # Zeichen) und ist nach oben gedeckelt. Laeuft ein Verfahren hinein,
    # gilt es als fehlgeschlagen und das naechste uebernimmt.
    synthesis_timeout_seconds: 40
    synthesis_timeout_per_100_chars: 8
    synthesis_timeout_max_seconds: 180
    max_characters: 260
    warmup_text: Bereit.
