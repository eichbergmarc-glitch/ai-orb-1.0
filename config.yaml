# Der taegliche Nachrichtenlauf: Schlagzeilen direkt von den Zeitungen (RSS)
# und die Meldungslage je Thema (GDELT). Ohne diesen Abschnitt gab es die
# Quellen zwar, aber niemanden, der sie ruft.
nachrichten:
  taeglich: true
  uhrzeit: '07:30'
  themen:
  - Politik
  - Wirtschaft
  - Weltlage
  hoechstens: 8
  # Einmal kurz nach dem Start, damit ein frisch eingerichteter Orb nicht
  # bis zum naechsten Morgen so aussieht, als taete er nichts.
  beim_start: true
  start_verzoegerung: 180

# Die Entscheidungen an den Toren der Anfrageverarbeitung.
# Siehe backend/orchestrator/faehigkeiten.py und task_router.py.
# Lehrer und Schueler: Claude ist die Referenz, Ollama lernt mit.
#
# Eine Kategorie wird NICHT uebergeben, weil sie gut aussieht, sondern erst,
# wenn sie in mehreren unabhaengigen Laeufen gemessen bestanden hat. Die
# Schwellen stehen hier, damit sie sichtbar und pruefbar sind - sie zu
# aendern ist laut den Regeln der Selbstverbesserung freigabepflichtig.
lernen:
  # Ob die stufenweise Uebergabe ueberhaupt stattfindet. false heisst:
  # gemessen wird weiter, entschieden wird nichts.
  uebergabe_aktiv: true
  # Hoechstens so viele Prozentpunkte darf der Schueler fachlich zurueckliegen.
  max_rueckstand_prozentpunkte: 3.0
  # Anteil der erfolgreichen Werkzeugablaeufe des Lehrers, den der Schueler
  # ebenfalls schaffen muss.
  mindest_werkzeugquote: 0.98
  # Anteil der Blindbewertungen, die den Schueler mindestens als gleichwertig
  # sehen muessen (ueber der Haelfte).
  mindest_blindurteil: 0.5
  # Wie viele unabhaengige Laeufe alle Bedingungen erfuellen muessen.
  noetige_laeufe: 3
  # Der Schattenbetrieb: Ollama rechnet mit, ohne die Antwort zu beeinflussen.
  schattenlauf_aktiv: false
  schattenlaeufe_je_stunde: 20
  # Womit im Schatten gerechnet wird. Leer heisst: die uebliche Wahl des
  # Providermanagers. Hier gehoert der Name des SCHUELERS hin, nicht der
  # des Lehrers - sonst misst der Schatten nichts.
  schattenlauf_modell: ''
  # Nach dieser Zeit wird ein Schattenlauf abgebrochen. Er laeuft neben dem
  # Zug des Benutzers, nicht in ihm - aber er darf sich nicht anhaeufen.
  schattenlauf_zeitgrenze_sekunden: 20.0
  # --- Guete des Blindbewerters -----------------------------------------
  # Jedes Paar wird zweimal vorgelegt, einmal in jeder Reihenfolge. Wie oft
  # der Bewerter dabei hoechstens die Meinung wechseln darf, ohne dass seine
  # Urteile als unbrauchbar gelten. 0.30 heisst: bei mehr als 30 % der Paare
  # entscheidet die Position statt der Antwort - dann ist keine belastbare
  # Uebergabeentscheidung moeglich.
  bewerter_max_positionswechsel: 0.30
  # So viele positionsstabile Urteile muss eine Kategorie mindestens haben,
  # damit ihre Gleichwertigkeitsquote ueberhaupt etwas bedeutet.
  bewerter_mindest_stabile_urteile: 2

