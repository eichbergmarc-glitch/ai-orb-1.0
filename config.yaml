voice:
  spoken_max_tokens: 40
  # Dieselbe Grenze, wenn ein Werkzeugaufruf hineinpassen muss.
  # In 40 Tokens passt keiner; ohne jede Grenze haelt der Orb
  # Vortraege. Deshalb zwei Werte statt einem Wert und keinem.
  spoken_max_tokens_mit_werkzeugen: 320
  vorlesung:
    abschnitt_max_tokens: 420
    pause_sekunden: 2.5
    max_abschnitte: 24
  enabled: true
  autostart: true
  hintergrund_erkennen: true
  follow_up_seconds: 120   # war 45: nach einer Antwort 2 Minuten ohne Weckwort weiterreden
  freie_ansprache: true
  barge_in: false
  barge_in_hold_ms: 270
  stop_words:
  - stop
  - stopp
  - halt
  stop_window_ms: 1500   # 13.11.: Cloud-Spaeher; war 600: halbiert die Rechenlast waehrend der Orb spricht (87 Fenster in einer Antwort)
  stop_waehrend_lokaler_stimme: true
  # AUS seit 12.11.2026: Der "Stopp"-Spaeher rechnete waehrend jeder Antwort
  # pausenlos (1,2 s Ton = bis 2,9 s Rechenzeit) - die Stimme stockte.
  # Unterbrechen: Escape-Taste, auf dem Handy der Pause-Knopf.
  stop_spaeher_aktiv: false   # 13.11. Ruecknahme: zuerst Tempo pruefen
  # 13.11.2026: "Stop Synapse" wieder an - der Spaeher erkennt jetzt in der
  # Cloud (keine Rechenlast am PC, ca. 0,1 Rappen pro Minute Sprechzeit).
  stop_spaeher_cloud: false
  stop_initial_prompt: Hallo Synapse. Hey Synapse.
  stop_model_size: base
  interrupt_key: Escape
  stream_speech: false   # bleibt aus: der normale Weg spricht mit LM Studio jetzt ohnehin Satz fuer Satz
  speaker:
    enabled: true
    enrollment_utterances: 3
    min_similarity: 0.55
    max_threshold: 0.55
    margin: 0.06
  sounds_enabled: true
  # AUS seit 06.11.2026: Der Orb hat sich staendig selbst unterbrochen.
  # Die Stop-Erkennung hoerte in seiner eigenen Lautsprecherstimme
  # "Hallo Synapse" (aus ihrem Vorgabetext) und hielt das fuer dich -
  # 8 abgebrochene Antworten in 10 Minuten. "Stopp" wirkt weiterhin.
  interrupt_on_speech: false
  interrupt_windows: 2
  interrupt_min_confidence: 0.45
  barge_in_min_aehnlichkeit: 0.82
  acknowledge_wake: true
  acknowledge_text: Ja?
  max_history: 50
  diktat:
    ziel_sekunden: 12
  wake_word:
    phrases:
    - Synapse
    - Hallo Synapse
    - Hey Synapse
    always_on: true
    threshold: 0.78
    max_leading_words: 3
  input:
    model_size: small
    language: de
    device: auto
    compute_type: int8
    cpu_threads: 0
    # Wie gruendlich Whisper sucht. Bewusst auf 5 erhoeht, nachdem der
    # Orb zu oft danebenlag (siehe test_die_suchbreite_wurde_erhoeht).
    #
    # Das kostet ungefaehr das Dreifache an Rechenzeit. Wenn die Erkennung
    # zu lange dauert, ist das der erste Hebel - aber es ist ein Tausch
    # gegen Genauigkeit und deshalb eine Entscheidung des Benutzers, keine
    # Reparatur. 2 waere der Mittelweg.
    beam_size: 4   # 06.11.: von 2 auf 4 - mit 2 verstand der Orb zu viel falsch; kostet etwa 1 s mehr
    # Kurz halten. Der lange Fachwortkatalog von vorher tauchte woertlich in
    # den Erkennungen auf ("Beginn jetzt mit dem Diktieren", "Syntax") und
    # verdraengte das Gesagte - Whisper "hoert" lange Vorgabetexte.
    # LEER seit 06.11.2026. Jeder Vorgabetext kam auf Rauschen woertlich
    # zurueck - erst der Fachwortkatalog, dann "lerne meine Stimme" (startete
    # das Einlernen immer wieder), zuletzt die Wortliste ("Nachrichten des
    # Tages, Wetter, Erinnerung"). Das Weckwort braucht ihn nicht mehr: Der
    # Orb erkennt Marc an der Stimme.
    initial_prompt: ''
    # Spracherkennung ueber OpenAI (06.11.2026). Genauer und schneller als
    # Whisper "small" auf der CPU. Faellt sie aus, erkennt die lokale wie
    # bisher. Das Stop-Wort und die Weckwort-Vorpruefung bleiben lokal.
    cloud:
      enabled: true
      api_key_env: OPENAI_API_KEY
      # gpt-4o-transcribe zuerst (12.11.2026): Die Mini-Fassung machte aus
      # Marcs Deutsch mit Schweizer Klang "Eklare mi den nye realismen".
      # Woerter, die Marc oft sagt (12.11.2026) - hilft der Erkennung bei
      # Ortsnamen und Schweizer Klang. Kommt nur dieser Hinweis zurueck,
      # wird er verworfen.
      prompt: 'Synapse, Melchnau, Giuch, Ostermundigen, Langenthal, Bern, Roggwil, Markus Gabriel, Neuer Realismus, Philosophie, Vorlesung.'
      models:
      - gpt-4o-mini-transcribe   # 13.11.: schneller als gpt-4o-transcribe
      - gpt-4o-transcribe
      - whisper-1
      timeout: 8
    # Das Webcam-Mikrofon (07.11.2026). Eingetragen ist ein Teil des
    # Geraetenamens; "cam" passt auf "Webcam", "Camera", "HD Webcam C270"
    # usw. Gibt es kein solches Geraet, nimmt der Orb die Windows-
    # Standard-Eingabe. null = immer Windows-Standard.
    microphone: cam
    # Fehlersuche (07.11.2026): die letzten 5 Aufnahmen bleiben in
    # logs\aufnahmen liegen, damit sich pruefen laesst, was das Mikrofon
    # wirklich liefert. Danach wieder auf 0 setzen.
    diagnose_aufnahmen: 0
    preroll_ms: 400
    # Wie lange Stille eine Aeusserung beendet.
    #
    # Hier standen 900 ms, und daran ist die fliessende Unterhaltung
    # gescheitert: Eine Denkpause mitten im Satz dauert regelmaessig
    # laenger als eine Sekunde. Der Orb hielt sie fuer das Ende, machte
    # aus einem Gedanken zwei Auftraege und fing an zu antworten,
    # waehrend noch gesprochen wurde.
    silence_ms: 1100   # war 1400; kuerzere Wartezeit bis zum Ende deiner Aussage
    threshold_factor: 3.0
    minimum_speech_ms: 350
    # Die harte Obergrenze einer einzelnen Aufnahme.
    #
    # Zwanzig Sekunden waren zu wenig: Im Protokoll vom 31.08.2026 steht
    # um 16:18 eine Aufnahme von exakt 20,1 Sekunden - abgeschnitten
    # mitten im Satz, erkennbar am wiederholten Schluss ("habe ich mir
    # aufgeschrieben. Ich habe mir aufgeschrieben."), wie Whisper es bei
    # einem abrupten Schnitt tut. Wer einen Gedanken ausformuliert,
    # braucht laenger.
    max_utterance_seconds: 45
    min_confidence: 0.35
    min_characters: 2
    rueckfrage_unter: 0.78
    rueckfrage_text: Das habe ich nicht sicher verstanden. Sagst du es noch einmal?
  output:
    thinking_sound: ''
    listening_sound: audio/zuhoeren.wav
    action_sound: audio/aktion.wav
    startup_sound: audio/start.wav
    enabled: true
    # Die Stimme (01.09.2026).
    #
    # Vorne steht jetzt OpenAI mit 'cedar' - die Stimme, fuer die weiter
    # unten in diesem Abschnitt eine ausfuehrliche Anweisung steht ("wie
    # ein spontaner, intelligenter Mensch ... erstklassiger Mentor und
    # Professor, aber ohne akademisches Gehabe"). Genau die war nie zu
    # hoeren: Am 25.08. antwortete OpenAI-TTS mit 429 (Guthaben), danach
    # lief der Orb ueber Supertonic und zuletzt ueber Pocket-TTS. OpenAI
    # empfiehlt fuer beste Qualitaet ausdruecklich 'cedar' und 'marin'.
    #
    # Pocket-TTS bleibt die zweite Reihe: lokal, schnell, ohne Netz.
    # Und deshalb steht 'allow_voice_fallback' jetzt auf true - mit
    # 'false' war ein Fehlschlag der ersten Stimme gleichbedeutend mit
    # Schweigen. Ein hoerbarer Stimmwechsel ist unschoen, Stille ist
    # schlimmer.
    # Reihenfolge der Stimmen - nur Verfahren mit WEIBLICHER Stimme. Faellt
    # Supertonic aus (Paket oder Modell fehlt), spricht sapi (Windows-Stimme
    # Hedda), damit der Orb nie stumm bleibt. pocket_tts (juergen) und piper
    # (thorsten) stehen bewusst nicht in der Kette: beides sind Maennerstimmen.
    # 07.11.2026: OpenAI-Stimme 'marin' (weiblich) zuerst. Supertonic auf der
    # CPU brauchte fuer einen Satz fast so lange, wie er dauert (RTF 0,9-1,1)
    # - dazwischen entstanden Pausen, die Antworten klangen abgehackt.
    # Ohne Netz oder Guthaben spricht wie bisher Supertonic (F1).
    engines:
    - openai_tts
    - supertonic
    - sapi
    offline_engines:
    - supertonic
    - sapi
    consistent_voice: true
    allow_voice_fallback: true
    speed: 1.0
    volume: 1.0
    stable_volume: true
    normalize_volume: true
    target_rms: 0.1
    trim_boundary_silence: true
    leading_silence_ms: 30
    anlauf_ms: 300   # 12.11.2026: Stille vor der ersten Silbe nach einer Pause - sonst fehlt der Anfang
    trailing_silence_ms: 70
    sentence_pause_ms: 60
    human_timing:
      enabled: true
      fillers_enabled: false
      filler_cooldown_seconds: 120
      minimum_words: 9
      adapt_to_user_rhythm: true
    emotions_enabled: true
    cache_enabled: true
    failure_cooldown_seconds: 90
    # Wie lange EIN Verfahren fuer EINEN Satz brauchen darf.
    #
    # Ohne diese Frist machte ein haengendes Verfahren den Orb stumm, ohne
    # eine Zeile zu schreiben: kein Fehler, kein Stimmwechsel, kein Ton.
    # Im Protokoll bis zum 06.09. sind das 281 von 694 Antworten.
    #
    # Die Frist waechst mit der Satzlaenge (Grundwert plus Zuschlag je 100
    # Zeichen) und ist nach oben gedeckelt. Laeuft ein Verfahren hinein,
    # gilt es als fehlgeschlagen und das naechste uebernimmt.
    synthesis_timeout_seconds: 40
    synthesis_timeout_per_100_chars: 8
    synthesis_timeout_max_seconds: 180
    max_characters: 260
    warmup_text: Bereit.
    supertonic:
      model: supertonic-3
      voice: F1   # F1-F5 weiblich, M1-M5 maennlich; Vorhoeren: STIMMEN-VORHOEREN.bat
      language: de
      steps: 5   # war 6: schneller, damit zwischen den Saetzen keine Luecken entstehen
      cpu_threads: 4
      chunk_silence_ms: 70
    pocket_tts:
      model_variant: german
      voice: juergen
      quantize: true
      temperature: 0.7
      sampler_decode_steps: 1
      eos_threshold: -4.0
      max_tokens: 50
      streaming: true
      prebuffer_ms: 600
      first_chunk_timeout: 15
    piper:
      voice: de_DE-thorsten-high
      models_directory: models/piper
    openvoice_clone:
      reference_audio: data/voice/orb-reference.wav
      source_reference: data/voice/piper-source-reference.wav
      source_directory: runtime/openvoice-source
      base_voice: de_DE-thorsten-high
      tau: 0.3
    edge_neural:
      voice: de-DE-FlorianMultilingualNeural
      rate_percent: 2
      pitch_hz: 0
      timeout_seconds: 4
    openai_tts:
      streaming: false   # 13.11.: Ruecknahme bis die Messung vorliegt
      model: gpt-4o-mini-tts
      voice: marin   # weiblich (cedar ist maennlich)
      api_key_env: OPENAI_API_KEY
      timeout: 25
      instructions: Sprich auf Deutsch wie ein spontaner, intelligenter Mensch in einem direkten Gespraech.
        Natuerlich, warm, praesent und praezise. Du bist ein erstklassiger Mentor und Professor, aber
        ohne akademisches Gehabe. Klinge locker und reagiere unmittelbar, nicht wie ein Lehrbuch, Nachrichtensprecher,
        Hoerbuch oder Kundendienst. Variiere Satzmelodie, Rhythmus und Tempo unaufdringlich. Kurze Saetze
        und Satzfragmente duerfen impulsiv klingen. Setze kleine natuerliche Pausen nur an Sinnstellen;
        nie lange, dramatische oder gleichfoermige Pausen. Ein trockenes, leicht ironisches Schnauben
        oder kurzes Lachen darf hoerbar werden, wenn der Text es wirklich traegt, aber nie als Ritual.
        Keine uebertriebene Freundlichkeit, kein Schauspiel und kein Roboterklang.
    chatterbox:
      reference_audio: data/voice/orb-reference.wav
      language: de
      device: auto
      model_variant: v3
      exaggeration: 0.5
      cfg_weight: 0.45
      temperature: 0.72
      repetition_penalty: 1.2
      min_p: 0.05
      top_p: 1.0
      max_new_tokens: 280
      tokens_per_character: 2.4
      token_margin: 32
      noise_w: 0.8
      noise_scale: 0.667
    sapi:
      voice: Microsoft Hedda Desktop
      timeout: 60
    kokoro:
      voice: af_heart
      language: en
    elevenlabs:
      voice_id: aV6RoO53eIRcDLcrLZpr
      model: eleven_flash_v2_5
      stability: 0.58
      similarity_boost: 0.85
      style: 0.0
      use_speaker_boost: true
      api_key_env: ELEVENLABS_API_KEY
    speechgen:
      voice: ''
      token_env: SPEECHGEN_TOKEN
      email_env: SPEECHGEN_EMAIL
    remote:
      endpoint: ''
      token_env: REMOTE_TTS_TOKEN
      speaker: 0
      timeout: 60
# Der taegliche Nachrichtenlauf: Schlagzeilen direkt von den Zeitungen (RSS)
# und die Meldungslage je Thema (GDELT). Ohne diesen Abschnitt gab es die
# Quellen zwar, aber niemanden, der sie ruft.
nachrichten:
  taeglich: true
  uhrzeit: '07:30'
  themen:
  - Politik
  - Wirtschaft
  - Weltlage
  hoechstens: 8
  # Einmal kurz nach dem Start, damit ein frisch eingerichteter Orb nicht
  # bis zum naechsten Morgen so aussieht, als taete er nichts.
  beim_start: true
  start_verzoegerung: 180

# Die Entscheidungen an den Toren der Anfrageverarbeitung.
# Siehe backend/orchestrator/faehigkeiten.py und task_router.py.
# Lehrer und Schueler: Claude ist die Referenz, Ollama lernt mit.
#
# Eine Kategorie wird NICHT uebergeben, weil sie gut aussieht, sondern erst,
# wenn sie in mehreren unabhaengigen Laeufen gemessen bestanden hat. Die
# Schwellen stehen hier, damit sie sichtbar und pruefbar sind - sie zu
# aendern ist laut den Regeln der Selbstverbesserung freigabepflichtig.
lernen:
  # Ob die stufenweise Uebergabe ueberhaupt stattfindet. false heisst:
  # gemessen wird weiter, entschieden wird nichts.
  uebergabe_aktiv: true
  # Hoechstens so viele Prozentpunkte darf der Schueler fachlich zurueckliegen.
  max_rueckstand_prozentpunkte: 3.0
  # Anteil der erfolgreichen Werkzeugablaeufe des Lehrers, den der Schueler
  # ebenfalls schaffen muss.
  mindest_werkzeugquote: 0.98
  # Anteil der Blindbewertungen, die den Schueler mindestens als gleichwertig
  # sehen muessen (ueber der Haelfte).
  mindest_blindurteil: 0.5
  # Wie viele unabhaengige Laeufe alle Bedingungen erfuellen muessen.
  noetige_laeufe: 3
  # Der Schattenbetrieb: Ollama rechnet mit, ohne die Antwort zu beeinflussen.
  schattenlauf_aktiv: false
  schattenlaeufe_je_stunde: 20
  # Womit im Schatten gerechnet wird. Leer heisst: die uebliche Wahl des
  # Providermanagers. Hier gehoert der Name des SCHUELERS hin, nicht der
  # des Lehrers - sonst misst der Schatten nichts.
  schattenlauf_modell: ''
  # Nach dieser Zeit wird ein Schattenlauf abgebrochen. Er laeuft neben dem
  # Zug des Benutzers, nicht in ihm - aber er darf sich nicht anhaeufen.
  schattenlauf_zeitgrenze_sekunden: 20.0
  # --- Guete des Blindbewerters -----------------------------------------
  # Jedes Paar wird zweimal vorgelegt, einmal in jeder Reihenfolge. Wie oft
  # der Bewerter dabei hoechstens die Meinung wechseln darf, ohne dass seine
  # Urteile als unbrauchbar gelten. 0.30 heisst: bei mehr als 30 % der Paare
  # entscheidet die Position statt der Antwort - dann ist keine belastbare
  # Uebergabeentscheidung moeglich.
  bewerter_max_positionswechsel: 0.30
  # So viele positionsstabile Urteile muss eine Kategorie mindestens haben,
  # damit ihre Gleichwertigkeitsquote ueberhaupt etwas bedeutet.
  bewerter_mindest_stabile_urteile: 2

